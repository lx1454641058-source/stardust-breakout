<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星尘突围 · 地牢射击原型</title>
  <style>
    :root { --ink:#eaf3ff; --muted:#9cb0c9; --panel:rgba(11,18,34,.88); --line:#29425e; --cyan:#54e5ff; --gold:#ffd166; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:#070b16; color:var(--ink); font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif; overflow:hidden; }
    body { display:block; }
    #shell { position:relative; width:100vw; height:100vh; min-width:0; min-height:0; background:#050914; overflow:hidden; box-shadow:none; }
    #shell:fullscreen { width:100vw; height:100vh; }
    canvas { width:100%; height:100%; display:block; image-rendering:auto; cursor:crosshair; }
    .hud { position:absolute; inset:0; pointer-events:none; padding:22px; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; }
    .brand { letter-spacing:.12em; font-size:13px; color:var(--cyan); font-weight:800; text-transform:uppercase; text-shadow:0 0 18px #54e5ff66; }
    .stats { width:240px; background:linear-gradient(135deg,#101c33ee,#0d1526ee); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
    .statline { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin:3px 0 7px; }
    .bar { height:7px; border-radius:99px; background:#15263d; overflow:hidden; margin-bottom:9px; }
    .fill { height:100%; transition:width .15s; }
    #hp { background:linear-gradient(90deg,#ff5470,#ff9b6b); }
    #xp { background:linear-gradient(90deg,#48d7ff,#8e7bff); }
    .hint { position:absolute; left:22px; bottom:20px; color:#9cb0c9bb; font-size:12px; line-height:1.7; }
    kbd { border:1px solid #49627e; color:#eaf3ff; background:#142238; border-radius:4px; padding:1px 5px; font-size:11px; }
    .overlay { pointer-events:auto; position:absolute; inset:0; display:grid; place-items:center; background:#050813d9; }
    .card { width:min(560px,calc(100% - 34px)); text-align:center; background:var(--panel); border:1px solid #34516f; border-radius:18px; padding:30px; box-shadow:0 20px 70px #0008; }
    h1 { margin:0 0 8px; font-size:40px; letter-spacing:.08em; color:#fff; } h2 { margin:0 0 10px; color:var(--gold); }
    p { color:var(--muted); line-height:1.65; font-size:14px; margin:8px 0 20px; }
    button { border:0; color:#071321; background:linear-gradient(135deg,#54e5ff,#8b9cff); border-radius:9px; padding:12px 24px; font-weight:900; cursor:pointer; font-size:14px; box-shadow:0 6px 22px #54e5ff33; }
    button:hover { filter:brightness(1.12); transform:translateY(-1px); }
    .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px; } .choices button { min-height:112px; background:#15263d; color:var(--ink); border:1px solid #2d4967; box-shadow:none; }
    .choices button:hover { border-color:var(--cyan); background:#1b3551; } .choices b { display:block; color:var(--cyan); margin-bottom:7px; } .choices small { color:var(--muted); font-weight:500; line-height:1.45; }
    .hidden { display:none; } .announce { position:absolute; top:105px; left:0; right:0; text-align:center; font-size:18px; color:#fff; text-shadow:0 2px 16px #000; opacity:0; transition:opacity .3s; }
    .settingsBtn { pointer-events:auto; position:absolute; right:22px; bottom:20px; padding:8px 13px; font-size:12px; background:#15263ddd; color:var(--ink); border:1px solid #41617f; box-shadow:none; }
    .settingsRow { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; text-align:left; margin:24px 0; color:var(--muted); }
    .settingsRow input { width:100%; accent-color:var(--cyan); }
    .tutorialCard { max-width:520px; border-color:#54e5ff99; }
    .tutorialStep { color:var(--cyan); font-size:12px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    .tutorialIcon { width:68px; height:68px; margin:16px auto 10px; display:grid; place-items:center; border-radius:50%; border:1px solid #54e5ff88; background:#102a43; color:var(--cyan); font-size:26px; box-shadow:0 0 28px #54e5ff44; }
    .tutorialActions { display:flex; justify-content:center; gap:10px; margin-top:20px; }
    .tutorialActions .skip { background:#24354c; color:var(--muted); box-shadow:none; }
    @media(max-width:600px){ .stats{width:180px}.hint{font-size:10px} h1{font-size:28px}.choices{grid-template-columns:1fr} .choices button{min-height:70px} }
  </style>
</head>
<body>
<main id="shell">
  <canvas id="game" width="1100" height="720"></canvas>
  <div class="hud">
    <div class="top"><div class="brand">✦ STARDUST BREAKOUT / RUN 01</div><div class="stats">
      <div class="statline"><span>护盾能量</span><span id="hpText">100 / 100</span></div><div class="bar"><div class="fill" id="hp" style="width:100%"></div></div>
      <div class="statline"><span>星尘等级 <b id="level">1</b></span><span id="xpText">0 / 30</span></div><div class="bar"><div class="fill" id="xp" style="width:0%"></div></div>
      <div class="statline"><span>波次 <b id="wave">1</b></span><span>击破 <b id="kills">0</b></span></div>
      <div class="statline"><span>武器</span><span id="weaponText">脉冲手枪</span></div>
      <div class="statline"><span>属性</span><span id="elementText">无</span></div>
    </div></div>
    <div class="announce" id="announce"></div>
    <div id="fpsText" style="position:absolute;left:22px;top:48px;z-index:3;pointer-events:none;color:#8fffc4;font:700 11px/1 monospace;letter-spacing:.08em;text-shadow:0 1px 2px #000">-- FPS</div>
    <button class="settingsBtn" id="settingsBtn">设置 / 特效</button>
    <div class="hint"><kbd>WASD</kbd> 移动　<kbd>鼠标</kbd> 瞄准 / 开火　<kbd>Space</kbd> 相位冲刺　<kbd>F</kbd> 全屏<br>收集蓝色星尘，升级你的武器。</div>
  </div>
  <div class="overlay" id="start"><div class="card"><h1>星尘突围</h1><p>一款原创的俯视角地牢射击小游戏。<br>在坍缩的星环里活下来，找到通往出口的路。</p><button id="startBtn">开始突围</button></div></div>
  <div class="overlay hidden" id="upgrade"><div class="card"><h2>星尘共振 · 选择强化</h2><p>你的能量与遗迹产生了共鸣。</p><div class="choices" id="choices"></div></div></div>
  <div class="overlay hidden" id="gameover"><div class="card"><h2 id="overTitle">护盾归零</h2><p id="overText"></p><button id="again">再次突围</button></div></div>
</main>
<div class="overlay hidden" id="settings"><div class="card"><h2>设置</h2><p>仅调整玩家弹幕、近战轨迹与元素融合特效；角色、敌人与敌方弹幕不受影响。</p><div class="settingsRow"><label for="fxOpacity">玩家弹幕 / 元素特效透明度</label><output id="fxOpacityValue">100%</output><input id="fxOpacity" type="range" min="0" max="100" value="100" step="5"></div><button id="closeSettings">返回游戏</button></div></div>
<div class="overlay hidden" id="tutorial"><div class="card tutorialCard"><div class="tutorialStep" id="tutorialStep">新手引导 · 1 / 5</div><div class="tutorialIcon" id="tutorialIcon">⌁</div><h2 id="tutorialTitle">移动与瞄准</h2><p id="tutorialText"></p><div class="tutorialActions"><button class="skip" id="skipTutorial">跳过</button><button id="nextTutorial">下一步</button></div></div></div>
<script>
(() => {
  const c=document.querySelector('#game'),ctx=c.getContext('2d'), W=c.width,H=c.height; const bgImage=new Image(); bgImage.src='star-ring-arena.png'; const unitAtlas=new Image(); unitAtlas.src='character-atlas.png'; const weaponAtlas=new Image(); weaponAtlas.src='weapon-atlas.png';
  if(!ctx.roundRect)ctx.roundRect=function(x,y,w,h,r=0){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this};
  const $=id=>document.getElementById(id), keys={}, mouse={x:550,y:360,down:false,right:false}; let state='start', last=0, raf, waveTimer=0, fxOpacity=1; try{fxOpacity=Number(localStorage.getItem('stardustFxOpacity')||1)}catch(e){}
  let p, bullets=[], enemyBullets=[], enemies=[], sparks=[], localFx=[], combatText=[], gems=[], wave=1, kills=0, spawnLeft=0, spawnClock=0, level=1, xp=0, xpNeed=30, fx={shake:0,flash:0}, upgrades={damage:0,rate:0,shield:0,speed:0,spread:0,crit:0,pierce:0,magnet:0,heal:0};
  const elementInfo={none:{name:'无',color:'#d8e7ff'},fire:{name:'炽焰',color:'#ff765c'},ice:{name:'寒霜',color:'#72d9ff'},shock:{name:'雷涌',color:'#ffe36e'},poison:{name:'蚀毒',color:'#a5ef70'}};
  const weapons={pulse:{name:'脉冲手枪',count:1,spread:.02,dmg:14,rate:.22,speed:520,color:'#ffd166',r:4,pierce:0},scatter:{name:'星云散射',count:5,spread:.13,dmg:9,rate:.52,speed:450,color:'#ff9b6b',r:4,pierce:0},rail:{name:'棱镜重炮',count:1,spread:0,dmg:58,rate:.78,speed:700,color:'#ff78b7',r:7,pierce:1},frost:{name:'霜火喷口',count:3,spread:.25,dmg:12,rate:.34,speed:400,color:'#54e5ff',r:5,pierce:0},drone:{name:'蜂群发射器',count:2,spread:.09,dmg:11,rate:.28,speed:560,color:'#9dff8a',r:3,pierce:1}};
  const weaponEvolution={pulse:'超载脉冲',scatter:'星云裂变',rail:'棱镜坍缩',frost:'绝对零度',drone:'蜂群协议'};
  Object.assign(weapons,{blade:{name:'星刃',count:1,spread:0,dmg:42,rate:.34,speed:0,color:'#ffd166',r:42,pierce:2,kind:'melee'},disc:{name:'旋刃回环',count:2,spread:.8,dmg:24,rate:.52,speed:0,color:'#ff78b7',r:30,pierce:1,kind:'melee'},shield:{name:'棱镜盾',count:1,spread:0,dmg:18,rate:.4,speed:0,color:'#72d9ff',r:46,pierce:4,kind:'shield'},aegis:{name:'反射壁垒',count:1,spread:0,dmg:26,rate:.55,speed:0,color:'#c98cff',r:54,pierce:6,kind:'shield',reflect:true}});
  addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(e.code==='Space') e.preventDefault(); }); addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
  c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height}); c.addEventListener('mousedown',e=>{if(e.button===2){mouse.right=true;mouse.down=false}else mouse.down=true}); addEventListener('mouseup',e=>{if(e.button===2)mouse.right=false;else mouse.down=false});c.addEventListener('contextmenu',e=>e.preventDefault());
  function toggleFullscreen(){let target=$('shell');if(document.fullscreenElement){let task=document.exitFullscreen?.();task&&task.catch&&task.catch(()=>{})}else{let task=target.requestFullscreen?.();task&&task.catch&&task.catch(()=>{})}}
  c.addEventListener('dblclick',toggleFullscreen);addEventListener('keydown',e=>{if(!e.repeat&&state==='play'&&e.key.toLowerCase()==='f'){e.preventDefault();toggleFullscreen()}});
  function reset(){ p={x:W/2,y:H/2,r:14,hp:100,maxHp:100,shot:0,dash:0,inv:0,angle:0,elements:[],elementLevels:{},weapons:['pulse'],weaponLevels:{pulse:1},cooldowns:{pulse:0},shieldActive:false,shieldGuard:0}; bullets=[];enemyBullets=[];enemies=[];sparks=[];localFx=[];combatText=[];gems=[];wave=1;kills=0;level=1;xp=0;xpNeed=30;upgrades={damage:0,rate:0,shield:0,speed:0,spread:0,crit:0,pierce:0,magnet:0,heal:0,duration:0,melee:0,guard:0,reflect:0,shieldRegen:0,aim:0};spawnLeft=8;spawnClock=0;waveTimer=0;updateHud(); }
  function start(){reset();state='play';$('start').classList.add('hidden');$('gameover').classList.add('hidden');}
  $('startBtn').onclick=start; $('again').onclick=start;
  function announce(t){$('announce').textContent=t;$('announce').style.opacity=1;setTimeout(()=>$('announce').style.opacity=0,1800)}
  const choiceData=[
    ['weapon','scatter','星云散射','一次发射 5 枚扇形弹丸'],['weapon','rail','棱镜重炮','高伤害，弹丸可穿透'],['weapon','frost','霜火喷口','三枚冰焰弹，射速快'],['weapon','drone','蜂群发射器','双发且自带穿透'],
    ['damage',null,'棱镜弹头','子弹伤害 +25%'],['rate',null,'脉冲线圈','射击间隔 -18%'],['shield',null,'折光护盾','最大护盾 +25，并恢复'],['speed',null,'轻轨靴','移动速度 +18%'],['spread',null,'分裂协议','额外增加一枚子弹'],['crit',null,'临界棱镜','12% 概率造成双倍伤害'],['pierce',null,'相位弹芯','子弹额外穿透一个敌人'],['magnet',null,'引力花环','星尘吸附范围 +55'],['heal',null,'微型修复舱','立即恢复 22 点护盾'],['element','fire','炽焰核心','命中后灼烧，持续伤害'],['element','ice','寒霜核心','命中后减速，叠满会冻结'],['element','shock','雷涌核心','命中后短暂麻痹并连锁'],['element','poison','蚀毒核心','命中后持续掉血']
  ];
  function updateHud(){$('hp').style.width=Math.max(0,p.hp/p.maxHp*100)+'%';$('hpText').textContent=Math.ceil(p.hp)+' / '+p.maxHp;$('xp').style.width=Math.min(100,xp/xpNeed*100)+'%';$('xpText').textContent=xp+' / '+xpNeed;$('level').textContent=level;$('wave').textContent=wave;$('kills').textContent=kills;$('weaponText').textContent=p.weapons.map(k=>weapons[k].name+' Lv.'+p.weaponLevels[k]).join(' · ');$('elementText').textContent=elementInfo[p.element].name;$('elementText').style.color=elementInfo[p.element].color;}
  function levelUp(){state='upgrade';$('upgrade').classList.remove('hidden');let picks=[...choiceData].sort(()=>Math.random()-.5).slice(0,3);$('choices').innerHTML='';picks.forEach(([key,value,name,desc])=>{let b=document.createElement('button');b.innerHTML='<b>'+name+'</b><small>'+desc+'</small>';b.onclick=()=>{let note=name;if(key==='weapon'){if(!p.weapons.includes(value)){p.weapons.push(value);p.weaponLevels[value]=1;p.cooldowns[value]=0;note='新增 '+name}else{p.weaponLevels[value]++;note=p.weaponLevels[value]>=2?weaponEvolution[value]+' Lv.'+p.weaponLevels[value]:name}}else if(key==='element'){if(!p.elements.includes(value)){p.elements.push(value);p.elementLevels[value]=1;note='融合 '+name}else{p.elementLevels[value]++;note=name+' Lv.'+p.elementLevels[value]}}else upgrades[key]++;if(key==='shield'){p.maxHp+=25;p.hp=p.maxHp}if(key==='heal')p.hp=Math.min(p.maxHp,p.hp+22);xp-=xpNeed;level++;xpNeed=Math.floor(xpNeed*1.35);$('upgrade').classList.add('hidden');state='play';announce('已融合：'+note);updateHud()};$('choices').appendChild(b)});}
  function updateHud(){$('hp').style.width=Math.max(0,p.hp/p.maxHp*100)+'%';$('hpText').textContent=Math.ceil(p.hp)+' / '+p.maxHp;$('xp').style.width=Math.min(100,xp/xpNeed*100)+'%';$('xpText').textContent=xp+' / '+xpNeed;$('level').textContent=level;$('wave').textContent=wave;$('kills').textContent=kills;$('weaponText').textContent=p.weapons.map(k=>weapons[k].name+' Lv.'+p.weaponLevels[k]).join(' · ');$('elementText').textContent=p.elements.length?p.elements.map(k=>elementInfo[k].name+' Lv.'+p.elementLevels[k]).join(' + '):'无';}
  function burst(x,y,col,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=30+Math.random()*110;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.4,col,size:2+Math.random()*4})}}
  function impact(x,y,col,power=1){burst(x,y,col,Math.floor(16*power));localFx.push({x,y,r:4,life:.5,max:.5,col,power});}
  function globalWeaponStats(){let loadoutBonus=Math.max(0,p.weapons.length-1)*.04;return{damage:1+upgrades.damage*.25+upgrades.crit*.04+upgrades.pierce*.03+loadoutBonus,rate:1-upgrades.rate*.18,count:upgrades.spread,pierce:upgrades.pierce}}
  function fireWeapon(key){let w=weapons[key],lv=p.weaponLevels[key]||1,a=p.angle,count=w.count+globalWeaponStats().count+Math.floor((lv-1)/2);for(let i=0;i<count;i++){let aa=a+(count>1?(i-(count-1)/2)*w.spread:0),crit=Math.random()<upgrades.crit*.12;bullets.push({x:p.x+Math.cos(aa)*18,y:p.y+Math.sin(aa)*18,vx:Math.cos(aa)*w.speed,vy:Math.sin(aa)*w.speed,r:w.r,life:1.2,dmg:w.dmg*globalWeaponStats().damage*(1+.12*(lv-1))*(crit?2:1),pierce:w.pierce+globalWeaponStats().pierce+Math.floor((lv-1)/3),color:elementInfo[p.element].color,element:p.element})}p.cooldowns[key]=w.rate*globalWeaponStats().rate*Math.max(.65,1-(lv-1)*.04)}

  function enemyShoot(e){let a=Math.atan2(p.y-e.y,p.x-e.x),speed=e.type==='boss'?210:170;enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:e.type==='boss'?7:5,life:3,color:e.type==='boss'?'#ff78b7':'#ff9b6b',dmg:e.type==='boss'?16:10});e.attack=e.type==='boss'?1.1:1.8;}
  function applyElement(e,type,damage){if(type==='none')return;if(type==='fire'){e.status.fire=Math.max(e.status.fire,2.5);e.hp-=damage*.08}if(type==='ice'){e.status.ice=Math.max(e.status.ice,2.2)}if(type==='shock'){e.status.shock=Math.max(e.status.shock,.55)}if(type==='poison'){e.status.poison=Math.max(e.status.poison,3.2)}if(type==='fire'&&e.status.ice>0){e.hp-=damage*.4;e.status.ice=0;burst(e.x,e.y,'#fff',8)}}

      ctx.globalAlpha=a*.72*fxOpacity;ctx.beginPath();for(let ray=0;ray<6;ray++){let ang=phase*.8+ray*Math.PI/3,inner=size*.18,outer=size*(.52+Math.sin(phase+ray)*.12);ctx.moveTo(Math.cos(ang)*inner,Math.sin(ang)*inner);ctx.lineTo(Math.cos(ang+.09)*outer*.58,Math.sin(ang+.09)*outer*.58);ctx.lineTo(Math.cos(ang-.05)*outer,Math.sin(ang-.05)*outer)}ctx.stroke();
      // Atlas is deliberately translucent and smaller than the procedural energy silhouette.
      if(ready){ctx.globalAlpha=a*.28*fxOpacity;ctx.drawImage(fusionAtlas,f[0]*sw,f[1]*sh,sw,sh,-size,-size,size*2,size*2)}
      else{ctx.globalAlpha=a*.55*fxOpacity;ctx.beginPath();ctx.arc(0,0,size*.56,0,Math.PI*2);ctx.stroke()}
      ctx.restore()
    }
    ctx.restore()
  };
  // --- Weapon projectile art: each weapon owns a distinct atlas cell plus a small dynamic treatment. ---
  const projectileAtlas=new Image();projectileAtlas.src='weapon-projectile-atlas.png';
  const projectileArtMap={pulse:0,scatter:1,rail:2,frost:3,drone:4,blade:5,disc:6};
  const projectileArtFireBase=fireWeapon;
  fireWeapon=function(key){let before=bullets.length;projectileArtFireBase(key);for(let i=before;i<bullets.length;i++){bullets[i].weaponArt=key;bullets[i].weaponArtLevel=p.weaponLevels[key]||1}};
  const projectileArtDrawBase=draw;
  draw=function(){
    projectileArtDrawBase();if(!projectileAtlas.complete||!projectileAtlas.naturalWidth)return;
    const cw=projectileAtlas.naturalWidth/4,ch=projectileAtlas.naturalHeight/2;
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let b of bullets){let key=b.weaponArt,idx=projectileArtMap[key];if(idx===undefined)continue;let melee=!!b.melee,a=melee?Math.atan2(b.y-p.y,b.x-p.x):Math.atan2(b.vy,b.vx),lv=b.weaponArtLevel||1,base=key==='rail'?48:key==='blade'?48:key==='disc'?38:key==='frost'?34:key==='drone'?30:key==='scatter'?23:30;
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a+(key==='blade'?0:Math.PI/4)+(key==='disc'?performance.now()/95:0));ctx.globalAlpha=Math.min(1,.78+(lv-1)*.05)*fxOpacity;
      // Light procedural motion keeps projectile art alive without covering the battlefield.
      ctx.strokeStyle=b.color||'#fff';ctx.lineWidth=key==='rail'?2.8:1.7;ctx.globalAlpha*=.62;
      if(key==='pulse'){ctx.beginPath();ctx.arc(0,0,base*.25+Math.sin(performance.now()/70)*2,0,Math.PI*2);ctx.stroke()}
      else if(key==='scatter'){ctx.beginPath();ctx.moveTo(-base*.55,-base*.12);ctx.lineTo(-base*.1,0);ctx.lineTo(-base*.55,base*.12);ctx.stroke()}
      else if(key==='rail'){ctx.beginPath();ctx.moveTo(-base*.82,0);ctx.lineTo(base*.75,0);ctx.stroke()}
      else if(key==='frost'){for(let n=0;n<3;n++){let q=n*Math.PI*2/3;ctx.beginPath();ctx.moveTo(-base*.25,0);ctx.lineTo(-base*.48+Math.cos(q)*7,Math.sin(q)*7);ctx.stroke()}}
      else if(key==='drone'){ctx.beginPath();ctx.arc(-base*.18,0,base*.12,0,Math.PI*2);ctx.stroke()}
      else if(key==='blade'){ctx.beginPath();ctx.arc(-base*.04,0,base*.42,-.8,.8);ctx.stroke()}
      else if(key==='disc'){ctx.beginPath();ctx.arc(0,0,base*.34,0,Math.PI*2);ctx.stroke()}
      ctx.globalAlpha=Math.min(1,.8+(lv-1)*.04)*fxOpacity;ctx.drawImage(projectileAtlas,(idx%4)*cw,Math.floor(idx/4)*ch,cw,ch,-base,-base,base*2,base*2);ctx.restore()
    }
    ctx.restore()
  };
  reset(); requestAnimationFrame(loop);
})();
</script>
